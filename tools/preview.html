<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFX Library — preview</title>
<style>
  :root {
    --bg: #14161c; --card: #1e212a; --line: #2e3340; --text: #e8eaf0;
    --dim: #8d94a6; --accent: #ffd54a; --real: #4ade80; --stub: #7a8296;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin-bottom: 20px; font-size: 14px; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--card);
         border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
         margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
  .bar label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
  .bar input[type=range] { width: 110px; accent-color: var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: #272b36; color: var(--text); padding: 7px 14px; }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
       margin: 28px 0 12px; }
  .filters { top: 62px; gap: 8px; }
  .flabel { font-size: 13px; color: var(--dim); margin-right: 2px; }
  button.f[aria-pressed="true"] { border-color: var(--accent); color: var(--accent);
                                  background: rgba(255,213,74,.1); }
  .filters input[type=search] { font: inherit; background: #272b36; color: var(--text);
       border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; min-width: 200px; }
  .filters input[type=search]:focus { outline: none; border-color: var(--accent); }
  .empty { color: var(--dim); font-size: 14px; padding: 20px 2px; }
  button.looping { border-color: var(--accent); color: var(--accent);
                   background: rgba(255,213,74,.12); }
  .card.looping { border-color: rgba(255,213,74,.5); }
  .takeno { font-size: 11px; color: var(--accent); margin-left: 2px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px;
          color: var(--accent); flex: 1; }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
         padding: 3px 7px; border-radius: 99px; }
  .tag.real { background: rgba(96,165,250,.15); color: #60a5fa; }
  .tag.code { background: rgba(74,222,128,.15); color: var(--real); }
  .tag.stub { background: rgba(122,130,150,.2); color: var(--stub); }
  .use { color: var(--dim); font-size: 13px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .meta { margin-left: auto; font-size: 12px; color: var(--stub); }
  .note { background: rgba(255,213,74,.08); border: 1px solid rgba(255,213,74,.25);
          border-radius: 10px; padding: 12px 14px; font-size: 13.5px; color: #e4d9b4; margin-bottom: 20px; }
</style>

<h1>SFX Library — preview</h1>
<div class="sub" id="sub">loading…</div>

<div class="note" id="note"></div>

<div class="bar">
  <button id="mute">🔊 Sound on</button>
  <label>master <input type="range" id="v-master" min="0" max="1" step="0.05"></label>
  <label>ui <input type="range" id="v-ui" min="0" max="1" step="0.05"></label>
  <label>game <input type="range" id="v-game" min="0" max="1" step="0.05"></label>
  <label>reward <input type="range" id="v-reward" min="0" max="1" step="0.05"></label>
  <label>music <input type="range" id="v-music" min="0" max="1" step="0.05"></label>
  <button id="spam">Tap ×12 (hear the pitch variation)</button>
  <button id="stars">3 stars in a row</button>
  <button id="combo">Combo ladder ×6</button>
  <button id="audit">Check every sound makes noise</button>
</div>

<div class="bar filters">
  <span class="flabel">Show</span>
  <button class="f" data-filter="all">All</button>
  <button class="f" data-filter="code">Code</button>
  <button class="f" data-filter="ai">ElevenLabs</button>
  <button class="f" data-filter="real">· generated</button>
  <button class="f" data-filter="stub">· still to do</button>
  <input type="search" id="q" placeholder="search name or use…" autocomplete="off">
  <span class="meta" id="shown"></span>
</div>

<div id="out"></div>

<script src="../dist/sfx.js"></script>
<script>
const CAT_ORDER = ['ui', 'game', 'reward', 'music'];

SFX.load('casual', { url: '../dist/casual.json' }).then(() => {
  const names = SFX.list();
  const state = n => {
    const d = SFX.info(n) || {};
    if (d.start != null) return 'real';                       // audio file in the sprite
    if (d.source === 'code') return 'code';                   // finished, made by code
    return 'stub';                                            // AI sound, audio not generated yet
  };
  const count = k => names.filter(n => state(n) === k).length;

  document.getElementById('sub').textContent =
    names.length + ' sounds · ' + count('code') + ' made by code · ' + count('real') +
    ' from real audio · ' + count('stub') + ' still waiting for audio';

  document.getElementById('note').innerHTML = count('stub') === 0
    ? 'Every sound is final. Listen through the whole board before publishing a version.'
    : '<b>' + count('code') + ' sounds are finished</b> — they are made by code and never need a file. ' +
      '<b>' + count('stub') + ' are waiting for real audio</b> and are playing a rough stand-in until then. ' +
      'Generate those with the prompts in <code>packs/casual/SOUND-PROMPTS.md</code>, drop the files into ' +
      '<code>packs/casual/sounds/</code>, then run <code>python3 tools/build_pack.py casual</code> and reload.';

  // 'ai' covers both the generated ones and the ones still waiting for audio.
  const matches = (n, f) => f === 'all' || (f === 'ai' ? state(n) !== 'code' : state(n) === f);

  let filter = 'all', query = '';
  try { filter = localStorage.getItem('sfx.preview.filter') || 'all'; } catch (e) {}

  const out = document.getElementById('out');
  const shown = document.getElementById('shown');

  let render = function () {
    const q = query.trim().toLowerCase();
    const visible = names.filter(n => matches(n, filter) &&
      (!q || n.toLowerCase().includes(q) ||
       ((SFX.info(n) || {}).whenToUse || '').toLowerCase().includes(q)));

    shown.textContent = visible.length === names.length
      ? names.length + ' sounds'
      : visible.length + ' of ' + names.length + ' shown';

    document.querySelectorAll('button.f').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.filter === filter)));

    const groups = {};
    visible.forEach(n => {
      const d = SFX.info(n) || {};
      (groups[d.category || 'ui'] = groups[d.category || 'ui'] || []).push([n, d]);
    });

    out.textContent = '';
    if (!visible.length) {
      const e = document.createElement('p');
      e.className = 'empty';
      e.textContent = 'Nothing matches that.';
      out.appendChild(e);
      return;
    }

    CAT_ORDER.filter(c => groups[c]).forEach(cat => {
      const h = document.createElement('h2');
      h.textContent = cat + ' — ' + groups[cat].length;
      out.appendChild(h);

      const grid = document.createElement('div');
      grid.className = 'grid';
      groups[cat].forEach(([name, d]) => {
        const st = state(name);
        const label = { real: 'real audio', code: 'code', stub: 'needs audio' }[st];
        const card = document.createElement('div');
        card.className = 'card';
        const takes = d.variations ? d.variations.length : 1;
        card.innerHTML =
          '<div class="top"><span class="name"></span>' +
          '<span class="tag ' + st + '">' + label + '</span></div>' +
          '<p class="use"></p>' +
          '<div class="row"><button data-play>▶ Play</button>' +
          '<button data-loop title="Loop this sound">⟳ Loop</button>' +
          (takes > 1 ? '<button data-v>▶ All ' + takes + ' takes</button>' : '') +
          '<span class="takeno"></span>' +
          '<span class="meta">~' + (d.duration ?? '?') + 's</span></div>';
        card.querySelector('.name').textContent = name;
        card.querySelector('.use').textContent = d.whenToUse || '';
        card.querySelector('[data-play]').onclick = () => SFX.play(name);
        const v = card.querySelector('[data-v]');
        if (v) v.onclick = () => d.variations.forEach((_, i) => setTimeout(() => SFX.play(name), i * 260));
        wireLoop(card, name, d, takes);
        grid.appendChild(card);
      });
      out.appendChild(grid);
    });
  };

  // ---- per-sound looping -------------------------------------------------
  // A sound marked loopable has been built with a crossfade, so it can loop
  // inside the sprite with no gap. Everything else is a one-shot, so looping it
  // means replaying it on a timer — and when it has several takes we step
  // through them in turn, which is what the game does over repeated plays.
  let active = null;                       // only one sound loops at a time

  function stopLoop() {
    if (!active) return;
    if (active.handle) SFX.stop(active.handle);
    if (active.timer) clearTimeout(active.timer);
    active.btn.classList.remove('looping');
    active.btn.textContent = '⟳ Loop';
    active.card.classList.remove('looping');
    active.counter.textContent = '';
    active = null;
  }

  function wireLoop(card, name, d, takes) {
    const btn = card.querySelector('[data-loop]');
    const counter = card.querySelector('.takeno');

    btn.onclick = () => {
      const wasMe = active && active.btn === btn;
      stopLoop();
      if (wasMe) return;                   // second click stops

      btn.classList.add('looping');
      btn.textContent = '■ Stop';
      card.classList.add('looping');
      active = { btn, card, counter, handle: null, timer: null };

      if (d.loopable) {
        // Seamless: the runtime loops the slice itself, no gap at all.
        active.handle = SFX.play(name, { loop: true });
        counter.textContent = 'seamless';
        return;
      }

      // One-shot: replay on a timer, stepping through the takes in turn.
      let i = 0;
      const gap = Math.max(90, (d.duration || 0.3) * 1000 + 70);
      const tick = () => {
        if (!active || active.btn !== btn) return;
        SFX.play(name);
        counter.textContent = takes > 1 ? 'take ' + (i % takes + 1) + '/' + takes : '';
        i++;
        active.timer = setTimeout(tick, gap);
      };
      tick();
    };
  }

  // Re-rendering throws away the cards, so stop any loop attached to them.
  const _render = render;
  render = function () { stopLoop(); _render(); };

  document.addEventListener('keydown', e => { if (e.key === 'Escape') stopLoop(); });

  document.querySelectorAll('button.f').forEach(b => {
    const n = { all: names.length, code: count('code'), ai: count('real') + count('stub'),
                real: count('real'), stub: count('stub') }[b.dataset.filter];
    b.textContent += ' (' + n + ')';
    b.onclick = () => {
      filter = b.dataset.filter;
      try { localStorage.setItem('sfx.preview.filter', filter); } catch (e) {}
      render();
    };
  });
  document.getElementById('q').oninput = e => { query = e.target.value; render(); };

  render();
});

// controls
const muteBtn = document.getElementById('mute');
muteBtn.onclick = () => {
  const m = SFX.mute();
  muteBtn.textContent = m ? '🔇 Sound off' : '🔊 Sound on';
};
['master', 'ui', 'game', 'reward', 'music'].forEach(c => {
  const el = document.getElementById('v-' + c);
  el.value = SFX.volume(c);
  el.oninput = () => { SFX.volume(c, +el.value); SFX.play('ui.toggle'); };
});
document.getElementById('spam').onclick = () => {
  for (let i = 0; i < 12; i++) setTimeout(() => SFX.play('ui.tap'), i * 90);
};
document.getElementById('combo').onclick = () => {
  for (let n = 0; n < 6; n++) setTimeout(() => SFX.play('match.combo', { rate: 1 + n * 0.12 }), n * 220);
};
document.getElementById('audit').onclick = async () => {
  const btn = document.getElementById('audit');
  const d = SFX.debug(), an = d.context.createAnalyser();
  an.fftSize = 2048; d.master.connect(an);
  const buf = new Float32Array(an.fftSize), silent = [];
  for (const n of SFX.list()) {
    btn.textContent = 'Checking ' + n + '…';
    let peak = 0;
    SFX.play(n);
    for (let i = 0; i < 14; i++) {
      await new Promise(r => setTimeout(r, 25));
      an.getFloatTimeDomainData(buf);
      for (let j = 0; j < buf.length; j++) peak = Math.max(peak, Math.abs(buf[j]));
    }
    if (peak < 0.005) silent.push(n);
  }
  btn.textContent = silent.length ? '✗ silent: ' + silent.join(', ') : '✓ all ' + SFX.list().length + ' make noise';
};
document.getElementById('stars').onclick = () => {
  [1, 2, 3].forEach(n => setTimeout(() => SFX.play('reward.star', { rate: 1 + (n - 1) * 0.12 }), (n - 1) * 420));
};
</script>
